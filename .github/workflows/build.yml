name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Gerar arquivos Gradle
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "LinuxVM"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.linuxvm"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.linuxvm"
                  minSdk = 26
                  targetSdk = 28
                  versionCode = 1
                  versionName = "1.0"
                  ndk { abiFilters += "arm64-v8a" }
              }
              packaging {
                  jniLibs { useLegacyPackaging = true }
              }
              lint { abortOnError = false }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

      - name: Baixar proot (Termux) para jniLibs
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y patchelf
          BASE=https://packages.termux.dev/apt/termux-main
          curl -fsSL "$BASE/dists/stable/main/binary-aarch64/Packages" -o Packages
          getdeb() {
            awk -v p="$1" 'BEGIN{RS="";FS="\n"} $1=="Package: "p {for(i=1;i<=NF;i++) if($i ~ /^Filename: /){sub(/^Filename: /,"",$i); print $i}}' Packages
          }
          mkdir -p work
          for pkg in proot libtalloc; do
            f=$(getdeb $pkg | head -n1)
            [ -n "$f" ] || { echo "pacote $pkg nao encontrado"; exit 1; }
            curl -fsSL "$BASE/$f" -o "work/$pkg.deb"
            dpkg-deb -x "work/$pkg.deb" work/x
          done
          U=work/x/data/data/com.termux/files/usr
          J=app/src/main/jniLibs/arm64-v8a
          mkdir -p $J
          cp "$U/bin/proot" $J/libproot.so
          cp "$U/libexec/proot/loader" $J/libproot-loader.so
          cp -L "$U/lib/libtalloc.so.2" $J/libtalloc.so
          patchelf --replace-needed libtalloc.so.2 libtalloc.so $J/libproot.so
          ls -l $J

      - name: Listar arquivos do projeto
        run: find app -type f | head -50

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LinuxVM-debug-apk
          path: app/build/outputs/apk/debug/*.apk
